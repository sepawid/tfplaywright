name: Playwright Tests (ager.pl Demo)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright E2E & Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks v8.30.1, full history)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Read-Only Smoke & Contract Tests
        env:
          PLAYWRIGHT_BASE_URL: https://ager.pl
        run: npx playwright test tests/specs/smoke tests/specs/ui/responsive_breakpoints.spec.ts tests/specs/api/public_api_demo.spec.ts

      - name: Validate DEMO_SECRET for Live E2E (Fail-Closed)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -z "$DEMO_SECRET" ]; then
            echo "::error::[SECURITY GATE ERROR] secrets.DEMO_SECRET nie jest skonfigurowany w repozytorium GitHub Actions. Zaufany przebieg mutujący nie może zostać uruchomiony bez sekretu."
            exit 1
          fi

      - name: Run Live E2E Mutating Tests (Trusted Events Only)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          PLAYWRIGHT_BASE_URL: https://ager.pl
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: npx playwright test tests/specs/e2e/live_synthetic_invoice.spec.ts

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
