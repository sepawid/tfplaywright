name: Playwright Tests (ager.pl Demo)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_mutating:
        description: 'Run mutating live E2E showcase against ager.pl (opt-in)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  read-only:
    name: Read-Only Smoke, UI & Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks v8.30.1, full history)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Record Target Application Git SHA
        env:
          PLAYWRIGHT_BASE_URL: https://ager.pl
        run: |
          set -euo pipefail
          APP_SHA=$(curl -s -i "${PLAYWRIGHT_BASE_URL}/health" | grep -i "x-app-git-sha:" | awk '{print $2}' | tr -d '\r\n' || echo "unknown")
          echo "APP_SHA=$APP_SHA" >> "$GITHUB_ENV"
          echo "### Target Application Version" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Base URL:** \`${PLAYWRIGHT_BASE_URL}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Application Git SHA:** \`${APP_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "[TARGET APP] Base URL: ${PLAYWRIGHT_BASE_URL}, Git SHA: ${APP_SHA}"

      - name: Run Read-Only Smoke, UI & Contract Tests
        env:
          PLAYWRIGHT_BASE_URL: https://ager.pl
          ALLOW_DEMO_MUTATIONS: 'false'
        run: npx playwright test tests/specs/smoke tests/specs/ui/responsive_breakpoints.spec.ts tests/specs/api/public_api_demo.spec.ts

      - name: Verify Test Results (Zero Skipped Policy)
        run: node scripts/verify_test_results.js

      - name: Sanitize Artifacts (Scrub Traces & Secrets)
        if: always()
        run: python3 scripts/sanitize_artifacts.py

      - name: Upload Read-Only Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-read-only
          path: playwright-report/
          retention-days: 14

  live-mutating:
    name: Live Mutating E2E Showcase (Trusted Events Only)
    needs: read-only
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.run_mutating == true)
    environment: live-demo
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate DEMO_SECRET for Live E2E (Fail-Closed)
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -z "${DEMO_SECRET:-}" ]; then
            echo "::error::[SECURITY GATE ERROR] secrets.DEMO_SECRET is not configured in environment 'live-demo'. Live mutating E2E requires a valid secret."
            exit 1
          fi

      - name: Record Target Application Git SHA
        env:
          PLAYWRIGHT_BASE_URL: https://ager.pl
        run: |
          set -euo pipefail
          APP_SHA=$(curl -s -i "${PLAYWRIGHT_BASE_URL}/health" | grep -i "x-app-git-sha:" | awk '{print $2}' | tr -d '\r\n' || echo "unknown")
          echo "APP_SHA=$APP_SHA" >> "$GITHUB_ENV"
          echo "### Live Mutating E2E Showcase" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Base URL:** \`${PLAYWRIGHT_BASE_URL}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Application Git SHA:** \`${APP_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "[TARGET APP] Live Mutating E2E on Git SHA: ${APP_SHA}"

      - name: Run Live E2E Mutating Showcase (Synthetic Invoice)
        env:
          PLAYWRIGHT_BASE_URL: https://ager.pl
          ALLOW_DEMO_MUTATIONS: 'true'
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: npx playwright test tests/specs/e2e/live_synthetic_invoice.spec.ts

      - name: Verify Test Results (Zero Skipped Policy)
        run: node scripts/verify_test_results.js

      - name: Sanitize Artifacts (Scrub Traces & Secrets)
        if: always()
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: python3 scripts/sanitize_artifacts.py

      - name: Upload Mutating Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-mutating
          path: playwright-report/
          retention-days: 14
