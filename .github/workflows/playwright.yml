name: Playwright Tests (ager.pl Demo)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright E2E & Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Read-Only Smoke & Contract Tests
        env:
          PLAYWRIGHT_BASE_URL: https://ager.pl
        run: npx playwright test tests/specs/smoke tests/specs/ui/responsive_breakpoints.spec.ts tests/specs/api/public_api_demo.spec.ts

      - name: Run Live E2E Mutating Tests (Trusted Events Only)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          PLAYWRIGHT_BASE_URL: https://ager.pl
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: npx playwright test tests/specs/e2e/live_synthetic_invoice.spec.ts

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
